<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow To-Do</title>
  <meta
      name="description"
      content="TaskFlow is a fast, keyboard-first task manager with a today dashboard, kanban board, projects, tags and command palette."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
  />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <!-- ============================= APP SHELL ============================= -->
  <div class="app">
    <!-- ---------------------------- Top bar ---------------------------- -->
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" /></svg>
      </button>

      <a class="brand" href="#/today" aria-label="TaskFlow home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" /></svg>
        </span>
        <span class="brand-name">TaskFlow</span>
      </a>

      <div class="search-wrap">
        <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" />
        </svg>
        <input
          id="searchInput"
          class="input search-input"
          type="search"
          autocomplete="off"
          data-i18n-placeholder="search.placeholder"
          data-i18n-aria="search.label"
        />
        <kbd class="only-desktop">/</kbd>
      </div>

      <div class="topbar-actions">
        <button class="btn btn-ghost only-desktop" id="paletteBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="3" /><path d="M8 10l3 3-3 3" />
          </svg>
          <span data-i18n="cmd.open">Commands</span>
          <kbd>⌘K</kbd>
        </button>
        <div class="seg" role="group" data-i18n-aria="lang.label">
          <button class="seg-btn" data-lang="en">EN</button>
          <button class="seg-btn" data-lang="de">DE</button>
        </div>
        <button class="icon-btn" id="themeBtn" data-i18n-aria="theme.toggle">
          <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8" />
          </svg>
          <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z" />
          </svg>
        </button>
        <button class="btn btn-primary" id="newTaskBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span data-i18n="task.new">New task</span>
        </button>
      </div>
    </header>

    <!-- ---------------------------- Sidebar ---------------------------- -->
    <div class="scrim" id="scrim" hidden></div>
    <aside class="sidebar" id="sidebar" data-i18n-aria="nav.label">
      <nav class="nav">
        <p class="nav-title" data-i18n="nav.views">Views</p>
        <a class="nav-item" href="#/today" data-route="today">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l3 2" /><circle cx="12" cy="12" r="9" /></svg>
          <span data-i18n="nav.today">Today</span>
        </a>
        <a class="nav-item" href="#/all" data-route="all">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" /></svg>
          <span data-i18n="nav.all">All tasks</span>
          <span class="count" id="countAll">0</span>
        </a>
        <a class="nav-item" href="#/upcoming" data-route="upcoming">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3" /><path d="M8 3v4M16 3v4M4 11h16" /></svg>
          <span data-i18n="nav.upcoming">Upcoming</span>
        </a>
        <a class="nav-item" href="#/projects" data-route="projects">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7a2 2 0 012-2h3l2 2h7a2 2 0 012 2v8a2 2 0 01-2 2H6a2 2 0 01-2-2z" /></svg>
          <span data-i18n="nav.projects">Projects</span>
        </a>
      </nav>

      <section class="nav">
        <p class="nav-title" data-i18n="nav.projects">Projects</p>
        <div id="projectList" class="chip-list"></div>
        <form id="projectForm" class="inline-form">
          <input class="input" id="projectInput" data-i18n-placeholder="project.new" maxlength="40" />
          <button class="btn btn-soft" type="submit" data-i18n="common.add">Add</button>
        </form>
      </section>

      <section class="nav">
        <p class="nav-title" data-i18n="nav.tags">Tags</p>
        <div id="tagList" class="chip-list"></div>
        <p class="nav-hint" id="tagEmptyHint" data-i18n="tags.hint">Add tags from a task.</p>
      </section>
    </aside>

    <!-- ----------------------------- Main ----------------------------- -->
    <main class="main" id="main">
      <!-- Quick add -->
      <form class="quickadd" id="quickAddForm">
        <span class="quickadd-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
        </span>
        <input
          id="quickAddInput"
          class="quickadd-input"
          autocomplete="off"
          data-i18n-placeholder="quickadd.placeholder"
          data-i18n-aria="quickadd.label"
        />
        <button class="btn btn-primary" type="submit" data-i18n="common.add">Add</button>
      </form>
      <p class="quickadd-help" data-i18n="quickadd.help"></p>

      <!-- Toolbar: filters + sort + view mode -->
      <section class="toolbar" data-i18n-aria="filters.label">
        <label class="field">
          <span class="field-label" data-i18n="filter.status">Status</span>
          <select class="input" id="filterStatus">
            <option value="all" data-i18n="filter.any">Any</option>
            <option value="todo" data-i18n="status.todo">To Do</option>
            <option value="doing" data-i18n="status.doing">In Progress</option>
            <option value="done" data-i18n="status.done">Done</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label" data-i18n="filter.priority">Priority</span>
          <select class="input" id="filterPriority">
            <option value="all" data-i18n="filter.any">Any</option>
            <option value="urgent" data-i18n="priority.urgent">Urgent</option>
            <option value="high" data-i18n="priority.high">High</option>
            <option value="medium" data-i18n="priority.medium">Medium</option>
            <option value="low" data-i18n="priority.low">Low</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label" data-i18n="filter.project">Project</span>
          <select class="input" id="filterProject"></select>
        </label>
        <label class="field">
          <span class="field-label" data-i18n="filter.tag">Tag</span>
          <select class="input" id="filterTag"></select>
        </label>
        <label class="field">
          <span class="field-label" data-i18n="filter.due">Due</span>
          <select class="input" id="filterDue">
            <option value="all" data-i18n="filter.any">Any</option>
            <option value="today" data-i18n="due.today">Today</option>
            <option value="tomorrow" data-i18n="due.tomorrow">Tomorrow</option>
            <option value="week" data-i18n="due.week">This week</option>
            <option value="overdue" data-i18n="due.overdue">Overdue</option>
            <option value="none" data-i18n="due.none">No date</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label" data-i18n="sort.label">Sort</span>
          <select class="input" id="sortBy">
            <option value="priority" data-i18n="sort.priority">Priority</option>
            <option value="due" data-i18n="sort.due">Due date</option>
            <option value="created" data-i18n="sort.created">Newest</option>
            <option value="title" data-i18n="sort.title">Title</option>
          </select>
        </label>
        <div class="toolbar-end">
          <button class="btn btn-ghost" id="resetFiltersBtn" data-i18n="filter.reset">Reset</button>
          <div class="seg" role="group" data-i18n-aria="view.label">
            <button class="seg-btn" data-view="list">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
              <span data-i18n="view.list">List</span>
            </button>
            <button class="seg-btn" data-view="kanban">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="5" height="14" rx="2"/><rect x="10" y="5" width="5" height="10" rx="2"/><rect x="16" y="5" width="4" height="14" rx="2"/></svg>
              <span data-i18n="view.kanban">Board</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Route content is rendered here -->
      <div id="viewRoot" aria-live="polite"></div>
    </main>
  <div>

  <!-- Mobile bottom nav -->
  <nav class="bottomnav only-mobile" data-i18n-aria="nav.label">
    <a href="#/today" data-route="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-i18n="nav.today">Today</span></a>
    <a href="#/all" data-route="all"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span data-i18n="nav.all">All</span></a>
    <button id="fabNew" class="fab" data-i18n-aria="task.new"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <a href="#/projects" data-route="projects"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7a2 2 0 012-2h3l2 2h7a2 2 0 012 2v8a2 2 0 01-2 2H6a2 2 0 01-2-2z"/></svg><span data-i18n="nav.projects">Projects</span></a>
    <button id="mobilePaletteBtn" data-i18n-aria="cmd.open"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 10l3 3-3 3"/></svg><span data-i18n="cmd.short">Cmd</span></button>
  </nav>

  <!-- ============================ TASK MODAL ============================ -->
    <div class="overlay" id="taskOverlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
        <header class="modal-head">
          <h2 id="taskModalTitle" data-i18n="task.new">New task</h2>
          <button class="icon-btn" id="taskCloseBtn" data-i18n-aria="common.close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </header>
        <form class="modal-body" id="taskForm" novalidate>
          <label class="field">
            <span class="field-label" data-i18n="task.title">Title</span>
            <input class="input" id="taskTitle" required maxlength="120" />
            <span class="error" id="taskTitleError" hidden data-i18n="task.titleRequired"></span>
          </label>
          <label class="field">
            <span class="field-label" data-i18n="task.desc">Description</span>
            <textarea class="input" id="taskDesc" rows="3" maxlength="600"></textarea>
          </label>
          <div class="grid-2">
<label class="field">
              <span class="field-label" data-i18n="filter.priority">Priority</span>
              <select class="input" id="taskPriority">
                <option value="urgent" data-i18n="priority.urgent"></option>
                <option value="high" data-i18n="priority.high"></option>
                <option value="medium" selected data-i18n="priority.medium"></option>
                <option value="low" data-i18n="priority.low"></option>
              </select>
            </label>
            <label class="field">
              <span class="field-label" data-i18n="filter.status">Status</span>
              <select class="input" id="taskStatus">
                <option value="todo" data-i18n="status.todo"></option>
                <option value="doing" data-i18n="status.doing"></option>
                <option value="done" data-i18n="status.done"></option>
              </select>
            </label>
          </div>
          <div class="field">
            <span class="field-label" data-i18n="task.due">Due date</span>
            <div class="row">
              <button class="btn btn-soft" type="button" data-due="today" data-i18n="due.today"></button>
              <button class="btn btn-soft" type="button" data-due="tomorrow" data-i18n="due.tomorrow"></button>
              <button class="btn btn-soft" type="button" data-due="clear" data-i18n="common.clear"></button>
              <input class="input" id="taskDue" type="date" data-i18n-aria="task.due" />
            </div>
          </div>
          <div class="grid-2">
            <label class="field">
              <span class="field-label" data-i18n="filter.project">Project</span>
              <select class="input" id="taskProject"></select>
            </label>
            <label class="field">
              <span class="field-label" data-i18n="task.tags">Tags</span>
              <input class="input" id="taskTags" data-i18n-placeholder="task.tagsPlaceholder" />
            </label>
          </div>

          <div class="field">
            <span class="field-label" data-i18n="task.subtasks">Subtasks</span>
            <ul class="subtask-edit" id="subtaskEditList"></ul>
            <div class="row">
              <input class="input" id="subtaskInput" data-i18n-placeholder="task.subtaskAdd" maxlength="120" />
              <button class="btn btn-soft" type="button" id="subtaskAddBtn" data-i18n="common.add"></button>
            </div>
          </div>

          <footer class="modal-foot">
            <button class="btn btn-ghost" type="button" id="taskCancelBtn" data-i18n="common.cancel"></button>
            <button class="btn btn-primary" type="submit" id="taskSaveBtn" data-i18n="common.save"></button>
          </footer>
        </form>
      </div>
    </div>

    <!-- ========================= COMMAND PALETTE ========================= -->
    <div class="overlay overlay-top" id="paletteOverlay" hidden>
      <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
        <div class="palette-input">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="paletteInput" autocomplete="off" data-i18n-placeholder="cmd.placeholder" />
          <kbd>Esc</kbd>
        </div>
        <ul class="palette-list" id="paletteList" role="listbox"></ul>
      </div>
    </div>

    <!-- Toasts -->
    <div class="toasts" id="toasts" aria-live="assertive" aria-atomic="true"></div>
  
</body>
</html>
