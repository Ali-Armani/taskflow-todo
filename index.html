<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow To-Do</title>
  <meta
      name="description"
      content="TaskFlow is a fast, keyboard-first task manager with a today dashboard, kanban board, projects, tags and command palette."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
  />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <!-- ============================= APP SHELL ============================= -->
  <div class="app">
    <!-- ---------------------------- Top bar ---------------------------- -->
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" /></svg>
      </button>

      <a class="brand" href="#/today" aria-label="TaskFlow home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" /></svg>
        </span>
        <span class="brand-name">TaskFlow</span>
      </a>

      <div class="search-wrap">
        <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" />
        </svg>
        <input
          id="searchInput"
          class="input search-input"
          type="search"
          autocomplete="off"
          data-i18n-placeholder="search.placeholder"
          data-i18n-aria="search.label"
        />
        <kbd class="only-desktop">/</kbd>
      </div>

      <div class="topbar-actions">
        <button class="btn btn-ghost only-desktop" id="paletteBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="3" /><path d="M8 10l3 3-3 3" />
          </svg>
          <span data-i18n="cmd.open">Commands</span>
          <kbd>⌘K</kbd>
        </button>
        <div class="seg" role="group" data-i18n-aria="lang.label">
          <button class="seg-btn" data-lang="en">EN</button>
          <button class="seg-btn" data-lang="de">DE</button>
        </div>
        <button class="icon-btn" id="themeBtn" data-i18n-aria="theme.toggle">
          <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8" />
          </svg>
          <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z" />
          </svg>
        </button>
        <button class="btn btn-primary" id="newTaskBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span data-i18n="task.new">New task</span>
        </button>
      </div>
    </header>
    
    
  <div>
</body>
</html>
